/* THANK YOU */
.thanks{position:relative;padding:56px var(--pad) 64px;text-align:center;overflow:hidden}
.angel-top{width:84px;margin:0 auto 18px;opacity:.85}
.couple{font-family:var(--caps);font-size:11px;letter-spacing:.28em;padding-left:.28em;color:var(--text);margin-bottom:18px}
.divider{width:min(100%,320px);margin:44px auto 0;opacity:.45}
a{text-decoration:none;color:inherit}
.thanks h2{font-family:var(--serif);font-weight:500;color:var(--text);font-size:clamp(25px,7vw,30px);margin:0 0 12px;letter-spacing:.02em}
.thanks p{font-size:14px;color:#8a7b70}
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:30px calc(var(--pad) * -1 + 8px) 0}
.grid6 button{aspect-ratio:1/1;overflow:hidden;background:#eee9e4}
.grid6 button{position:relative}
.grid6 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.grid6 img.swap{opacity:0;transition:opacity .9s ease}
.grid6 img.swap.in{opacity:1}
.bubbles{position:relative;margin:4px auto 0}
.bubble{position:absolute;border-radius:50%;overflow:hidden;background:#e7e2dc;box-shadow:0 2px 8px rgba(60,40,30,.075);will-change:transform;transition:transform .25s ease-out}
.bubble img{width:100%;height:100%;object-fit:cover}
.bubble-tip{margin-top:18px;font-family:'Cinzel',serif;font-size:9px;font-weight:400;letter-spacing:.26em;padding-left:.26em;color:#a0948b;text-align:center;line-height:1.8}
.bubble-tip span{display:block;font-family:var(--sans);font-size:12px;letter-spacing:0;padding:0;opacity:.6;line-height:1}
.more-row{text-align:center;margin-top:30px}
.more{display:inline-flex;align-items:center;gap:10px;font-family:var(--caps);font-size:11px;letter-spacing:.3em;padding:6px 0 6px .3em;color:var(--text)}
.more span{font-family:var(--sans);font-size:12px;letter-spacing:0}

/* CHAPTER TABS */

/* GALLERY */
.chapter{padding:56px var(--pad) 8px}
.ch-head{text-align:center;margin-bottom:24px}
.ch-head .no{font-family:var(--en);font-style:italic;font-weight:500;font-size:28px;color:#a08c80}
.ch-head .no::after{content:'';display:block;width:28px;height:1px;background:var(--line);margin:10px auto 0}
.masonry{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.masonry button{display:block;width:100%;aspect-ratio:3/4;overflow:hidden;background:#eee9e4}
.masonry button.wide{grid-column:span 2;aspect-ratio:auto}
.masonry button:not(.wide) img{height:100%;object-fit:cover}
.masonry img{width:100%;height:auto}

/* BEHIND — feed */
.feed{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.feed button{border-radius:16px;overflow:hidden;background:#eee9e4;aspect-ratio:3/4}
.feed button:first-child{grid-column:span 2;aspect-ratio:1/1}
.feed button:first-child img{object-position:50% 30%}
.feed img{width:100%;height:100%;object-fit:cover}

/* CLOSING */
.closing{padding:80px var(--pad) calc(64px + env(safe-area-inset-bottom));text-align:center}
.closing .angel{width:72px;margin:0 auto 18px;opacity:.8}
.closing .en{font-family:var(--en);font-style:italic;font-size:21px;color:var(--ink)}
.closing .ko{font-family:var(--serif);font-size:14px;margin-top:10px}
.closing .names{color:var(--text);margin-top:34px;font-size:11px}
.closing small{display:block;margin-top:8px;font-family:var(--caps);font-size:10px;letter-spacing:.3em;color:#a39a92}

/* 길게 눌러 저장 막기 */
img{-webkit-touch-callout:none;pointer-events:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}

.pre{padding:56px var(--pad) 0;text-align:center}
.pre-btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--caps);font-size:11px;letter-spacing:.3em;padding:6px 0 6px .3em;color:var(--text)}
.pre-btn span{font-family:var(--sans);font-size:12px;letter-spacing:0;transition:transform .3s}
.pre.open .pre-btn span{transform:rotate(180deg)}
.pre-grid{display:none;grid-template-columns:repeat(3,1fr);gap:3px;margin:22px calc(var(--pad) * -1 + 8px) 0}
.pre.open .pre-grid{display:grid}
.pre-grid button{aspect-ratio:1/1;overflow:hidden;background:#eee9e4}
.pre-grid img{width:100%;height:100%;object-fit:cover}

/* VIEWER */
.viewer{position:fixed;inset:0;z-index:50;background:#0d0b0a;display:none;touch-action:none;user-select:none;-webkit-user-select:none}
.viewer.open{display:block}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:0 0;will-change:transform}
.vbar{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;color:#fff;z-index:2}
.vbar.top{top:0;padding-top:calc(env(safe-area-inset-top) + 10px);background:linear-gradient(rgba(0,0,0,.55),transparent)}
.vbar.bot{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(transparent,rgba(0,0,0,.6));justify-content:center;gap:12px}
.vbar .count{font-family:var(--caps);font-size:12px;letter-spacing:.2em}
.icon{width:44px;height:44px;display:grid;place-items:center;font-size:24px;line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border:1px solid rgba(255,255,255,.45);border-radius:99px;font-size:13px;color:#fff;text-decoration:none}
.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;color:#fff;font-size:30px;width:48px;height:72px;opacity:.75}
.nav.prev{left:0}.nav.next{right:0}
@media (hover:none){.nav{display:none}}
.pin{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(13,11,10,.7);padding:var(--pad)}
.pin.open{display:flex}
.pin form{width:100%;max-width:320px;background:var(--bg);border-radius:18px;padding:30px 24px 22px;text-align:center;color:var(--text)}

.pin input{width:100%;margin-top:18px;padding:12px;border:1px solid var(--line);border-radius:10px;font:500 22px var(--sans);letter-spacing:.6em;text-align:center;background:#fff;color:var(--ink)}

.pin .row button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);font-size:14px}

.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

@media (prefers-reduced-motion:reduce){.scroll i{animation:none}html{scroll-behavior:auto}}
</style>

<body>

  <img src="photos/m/main-hero.jpg" alt="촛불과 꽃길 사이에서 마주 보는 신랑 신부" fetchpriority="high">

<script>
const CH = [
  ['snap','The Wedding Snap'],
  ['iphone','iPhone Snap'],
];
const ROMAN = ['i.','ii.','iii.','iv.','v.','vi.'];
let list = [];   // viewer order

const thumb = (p, cls) => {
  const b = document.createElement('button');
  if (cls) b.className = cls;
  b.setAttribute('aria-label','사진 크게 보기');
  const fit = e => Math.round(p.w >= p.h ? Math.min(e, p.w) : Math.min(e, p.h) * p.w / p.h);   // 긴 변 e 기준 가로폭
  b.innerHTML = `<img src="photos/t/${p.id}.jpg" srcset="photos/t/${p.id}.jpg ${fit(900)}w, photos/m/${p.id}.jpg ${fit(2000)}w"
    sizes="${cls === 'wide' ? 'min(100vw, 560px)' : '(max-width:560px) 50vw, 280px'}" width="${p.w}" height="${p.h}" loading="lazy" decoding="async" alt="">`;
  b._p = p; b.onclick = () => openViewer(list.indexOf(p));
  return b;
};

fetch('photos/photos.json', {cache:'no-cache'}).then(r => r.json()).then(all => {
  const used = CH.filter(([k]) => all.some(p => p.chapter === k));
  list = used.flatMap(([k]) => all.filter(p => p.chapter === k));

  // 감사 섹션 3x2 — 화질 좋은 본식스냅을 먼저
  // 감사 섹션 6칸: 2초마다 한 칸씩 다른 사진으로 천천히 바뀐다
  const pool = list.filter(p => !p.hero), g6 = document.getElementById('grid6');
  const tiles = pool.slice(0, 6).map(p => {
    const t = thumb(p); t._p = p; t.onclick = () => openViewer(list.indexOf(t._p)); g6.append(t); return t;
  });
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) setInterval(() => {
    if (document.hidden || V.classList.contains('open')) return;
    const free = pool.filter(p => !tiles.some(t => t._p === p));
    if (!free.length) return;
    const t = tiles[Math.random() * tiles.length | 0], p = free[Math.random() * free.length | 0];
    const im = new Image(); im.alt = ''; im.className = 'swap'; im.src = `photos/t/${p.id}.jpg`;
    im.onload = () => {
      t._p = p; t.append(im);
      requestAnimationFrame(() => requestAnimationFrame(() => im.classList.add('in')));
      setTimeout(() => [...t.querySelectorAll('img')].slice(0, -1).forEach(o => o.remove()), 1000);
    };
  }, 2000);

  // PRE-WEDDING: 접혀 있다가 누르면 3칸 격자로 펼쳐짐 (사진이 있을 때만 보임)
  const pre = all.filter(p => p.chapter === 'pre');
  if (pre.length) {
    const box = document.getElementById('pre'), grid = box.querySelector('.pre-grid'), btn = box.querySelector('.pre-btn');
    pre.forEach(p => grid.append(thumb(p)));
    box.hidden = false;
    btn.onclick = () => { const o = box.classList.toggle('open'); btn.setAttribute('aria-expanded', o); };
  }

  const main = document.getElementById('gallery');
  used.forEach(([k, en], i) => {
    const sec = document.createElement('section');
    sec.className = 'chapter'; sec.id = 'ch-' + k;
    sec.innerHTML = `<div class="ch-head"><h3 class="no" aria-label="${en}">${ROMAN[i]}</h3></div>`;
    const photos = all.filter(p => p.chapter === k);
    let box;
    if (k === 'snap') { sec.append(bubbles(photos)); sec.insertAdjacentHTML('beforeend', '<p class="bubble-tip"><span aria-hidden="true">⌃</span>TAP TO VIEW</p>'); main.append(sec); return; }
    // 2칸 격자: 왼→오른쪽, 위→아래로 식순 그대로 (가로 사진은 한 줄 전체)
    box = document.createElement('div'); box.className = 'masonry';
    photos.forEach(p => box.append(thumb(p, p.w > p.h * 1.2 ? 'wide' : '')));
    sec.append(box); main.append(sec);
  });
  // 넘겨 보기 순서를 화면에 보이는 순서(위→아래, 왼→오른쪽)와 똑같이 맞춘다
  const shown = [...main.querySelectorAll('.masonry button')].map(b => ({p: b._p, r: b.getBoundingClientRect()}))
    .sort((a, b) => Math.abs(a.r.top - b.r.top) > 8 ? a.r.top - b.r.top : a.r.left - b.r.left).map(o => o.p);
  list = list.filter(p => !shown.includes(p) && p.chapter !== 'pre').concat(shown, pre);   // PRE-WEDDING은 맨 뒤
});

/* 본식스냅: 애플워치 홈 화면처럼 벌집 모양 동그라미. 화면 가운데에 올수록 커진다 */
function bubbles(photos) {
  const wrap = document.createElement('div'); wrap.className = 'bubbles';
  const size = [1, .84, .93, .78, .9, .97, .8, .88];             // 동그라미마다 조금씩 다른 크기
  const els = photos.map((p, i) => {
    const b = document.createElement('button'); b.className = 'bubble'; b.setAttribute('aria-label', '사진 크게 보기');
    b.innerHTML = `<img src="photos/t/${p.id}.jpg" loading="lazy" decoding="async" alt="">`;
    b.onclick = () => openViewer(list.indexOf(p)); b._k = size[i % size.length];
    wrap.append(b); return b;
  });
  function layout() {
    const W = Math.min(innerWidth, 560) - 48, sx = W / 4, sy = sx * .88, D = sx * .94;
    let i = 0, row = 0;
    while (i < els.length) {
      const n = Math.min(row % 2 ? 4 : 3, els.length - i);
      for (let c = 0; c < n; c++, i++) {
        const x = W / 2 + (c - (n - 1) / 2) * sx, y = D / 2 + row * sy, d = D * els[i]._k;
        Object.assign(els[i].style, {left: x - d / 2 + 'px', top: y - d / 2 + 'px', width: d + 'px', height: d + 'px'});
      }
      row++;
    }
    wrap.style.width = W + 'px'; wrap.style.height = (row - 1) * sy + D + 'px';
    fisheye();
  }
  function fisheye() {
    const cy = innerHeight / 2, cx = innerWidth / 2;
    els.forEach(b => {
      const r = b.getBoundingClientRect();
      const dy = Math.min(Math.abs(r.top + r.height / 2 - cy) / innerHeight, .7), dx = Math.abs(r.left + r.width / 2 - cx) / innerWidth;
      b.style.transform = `scale(${(1.08 - dy * .55 - dx * .25).toFixed(3)})`;
    });
  }
  let raf = 0;
  addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; fisheye(); }); }, {passive:true});
  addEventListener('resize', layout);
  layout();
  return wrap;
}

// 첫 화면: 2초마다 두 사진이 천천히 번갈아 나온다 (사진 보기 중·다른 탭일 때는 멈춤)
(() => {
  const alt = document.querySelector('.hero-alt');
  if (!alt || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  setInterval(() => { if (!document.hidden && !V.classList.contains('open')) alt.classList.toggle('on'); }, 3800);   // 2초 머문 뒤 1.8초 동안 천천히 전환
})();

/* ---------- 뷰어: 스와이프 · (가족만) 확대 · 원본 저장 ---------- */
const V = document.getElementById('viewer'), img = document.getElementById('vimg'), stage = document.getElementById('stage');
let cur = 0, z = {s:1, x:0, y:0};

function apply() { img.style.transform = `translate(${z.x}px,${z.y}px) scale(${z.s})`; }
function reset() { z = {s:1, x:0, y:0}; img.style.transition = 'none'; apply(); }
function show(i) {
  cur = (i + list.length) % list.length;
  const p = list[cur];
  reset();
  img.src = `photos/t/${p.id}.jpg`;                        // 바로 보이게 썸네일 먼저
  const hi = new Image(); hi.src = `photos/m/${p.id}.jpg`;
  hi.onload = () => { if (list[cur] === p) img.src = hi.src; };
  document.getElementById('count').textContent = `${cur + 1} / ${list.length}`;
  [list[cur + 1], list[cur - 1]].forEach(n => { if (n) new Image().src = `photos/m/${n.id}.jpg`; });
}
/* 가족 비밀번호: 맞으면 원본 폴더 이름을 만들고, 이 기기에 기억한다 */
const fnv = t => { let h = 0x811c9dc5; for (const b of new TextEncoder().encode(t)) h = Math.imul(h ^ b, 0x01000193) >>> 0; return h.toString(16).padStart(8, '0'); };
let family = null;                                         // 원본 폴더 이름 (비밀번호 확인 시, 이번 한 번만)
const tryPin = pin => fnv('chk:' + pin) === '2c461b30' ? (family = 'o-' + fnv('dir:' + pin) + fnv('dir2:' + pin)) : null;
try { localStorage.removeItem('ghw-pin'); } catch (e) {}       // 예전 버전이 기억해 둔 비밀번호 지우기 — 이제는 저장할 때마다 묻는다

function download() {
  const p = list[cur], a = document.createElement('a');
  a.href = `photos/${family}/${p.id}.jpg`; a.download = `wedding-${p.id}.jpg`;
  document.body.append(a); a.click(); a.remove();
}
const pinBox = document.getElementById('pin'), pinIn = document.getElementById('pinIn'), pinErr = document.getElementById('pinErr');
document.getElementById('save').onclick = () => {
  pinIn.value = ''; pinErr.textContent = ''; pinBox.classList.add('open'); setTimeout(() => pinIn.focus(), 50);
};
document.getElementById('pinCancel').onclick = () => pinBox.classList.remove('open');
document.getElementById('pinForm').onsubmit = e => {
  e.preventDefault();
  if (tryPin(pinIn.value)) {
    pinBox.classList.remove('open'); download(); family = null;
  } else {
    pinErr.textContent = '비밀번호가 맞지 않아요.'; pinIn.value = '';
    const f = e.target; f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
  }
};

function openViewer(i) { V.classList.add('open'); document.body.style.overflow = 'hidden'; history.pushState({v:1}, ''); show(i); }
function closeViewer() { V.classList.remove('open'); document.body.style.overflow = ''; }
document.getElementById('close').onclick = () => history.back();
window.addEventListener('popstate', () => { if (V.classList.contains('open')) closeViewer(); });
document.getElementById('prev').onclick = () => show(cur - 1);
document.getElementById('next').onclick = () => show(cur + 1);
addEventListener('keydown', e => {
  if (!V.classList.contains('open')) return;
  if (e.key === 'ArrowLeft') show(cur - 1);
  if (e.key === 'ArrowRight') show(cur + 1);
  if (e.key === 'Escape') history.back();
});

// 넘기기만: 좌우로 밀면 이전/다음, 아래로 밀면 닫기. 확대는 누구에게도 허용하지 않는다.
let g = null;
stage.addEventListener('pointerdown', e => {
  if (!e.isPrimary) { g = null; return; }                  // 두 번째 손가락이 닿으면 동작 취소
  stage.setPointerCapture(e.pointerId); img.style.transition = 'none';
  g = {x:e.clientX, y:e.clientY};
});
stage.addEventListener('pointermove', e => {
  if (!g || !e.isPrimary) return;
  const dx = e.clientX - g.x, dy = e.clientY - g.y;
  z.x = dx; z.y = Math.abs(dy) > Math.abs(dx) ? dy * .6 : 0; apply();
});
function up(e) {
  if (!e.isPrimary) return;
  img.style.transition = 'transform .2s';
  if (g) {
    const dx = e.clientX - g.x, dy = e.clientY - g.y;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) { g = null; return show(cur + (dx < 0 ? 1 : -1)); }
    if (dy > 110 && Math.abs(dy) > Math.abs(dx)) { g = null; return history.back(); }
  }
  z.x = z.y = 0; apply(); g = null;
}
stage.addEventListener('pointerup', up);
// 브라우저 자체 확대(두 손가락 벌리기 · 두 번 탭)도 사진 보기 중에는 막는다
const viewing = () => V.classList.contains('open');
['gesturestart','gesturechange','gestureend'].forEach(t => document.addEventListener(t, e => { if (viewing()) e.preventDefault(); }, {passive:false}));
document.addEventListener('touchmove', e => { if (viewing() && e.touches.length > 1) e.preventDefault(); }, {passive:false});
V.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('contextmenu', e => { if (e.target.tagName === 'IMG') e.preventDefault(); });
stage.addEventListener('pointercancel', up);
</script>
</body>
</html>
